kind = "web"
previewPath = "/"
title = "CIAO Italia"
version = "1.0.0"
id = "artifacts/ciao-italia"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22255

[services.development]
run = "pnpm --filter @workspace/ciao-italia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ciao-italia", "run", "build" ]
publicDir = "artifacts/ciao-italia/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22255"
BASE_PATH = "/"
